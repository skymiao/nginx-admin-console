version: '3.8'

services:
  nginx:
    container_name: nginx-admin-nginx
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx-data/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-data/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-data/html:/usr/share/nginx/html:ro
      - ./nginx-data/logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    networks:
      - nginx-admin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx_status"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    container_name: nginx-admin-backend
    image: nginx-admin-console-backend:${VERSION:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production}
      - NGINX_CONFIG_PATH=/etc/nginx
      - NGINX_LOG_PATH=/var/log/nginx
      - DB_PATH=/tmp/nginx-admin.db
    volumes:
      - ./nginx-data:/tmp/nginx-admin
      - ./nginx-data/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-data/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-data/logs:/var/log/nginx
    networks:
      - nginx-admin-network
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: nginx-admin-frontend
    image: nginx-admin-console-frontend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - nginx-admin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx-admin-network:
    driver: bridge
