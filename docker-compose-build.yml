version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nginx-admin-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production}
      - NGINX_CONFIG_PATH=/etc/nginx
      - NGINX_LOG_PATH=/var/log/nginx
      - DB_PATH=/tmp/nginx-admin.db
    volumes:
      - /root/test/nginx-data:/tmp
      - /etc/nginx:/etc/nginx
      - /var/log/nginx:/var/log/nginx
    networks:
      - nginx-admin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://backend:5000
    container_name: nginx-admin-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - nginx-admin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx-admin-network:
    driver: bridge
