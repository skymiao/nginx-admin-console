version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nginx-admin-console-backend:1.0.0
    container_name: nginx-admin-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-encryption-key-change-this-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - NGINX_CONFIG_PATH=/etc/nginx
      - NGINX_LOG_PATH=/var/log/nginx
      - DB_PATH=/app/data/nginx-admin.db
    volumes:
      - /data/10.5.0.200-old/test/nginx-data:/app/data
      - /etc/nginx:/etc/nginx
      - /var/log/nginx:/var/log/nginx
    networks:
      - nginx-admin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://backend:5000
    image: nginx-admin-console-frontend:1.0.0
    container_name: nginx-admin-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - nginx-admin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx-admin-network:
    driver: bridge
